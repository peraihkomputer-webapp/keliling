<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#C2410C">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Keliling</title>
<style>
:root{--bg:#fff;--fg:#1B1F2A;--mu:#4A5160;--ln:#DADFE7;--ac:#C2410C;--on:#fff;--tl:#0B5F5A;--tb:#E6F4F1;--mp:#EEF1F5;--cd:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root{--bg:#14171F;--fg:#F1F3F7;--mu:#B4BBC9;--ln:#2B303C;--ac:#FB923C;--on:#14171F;--tl:#7EDBD2;--tb:#12302D;--mp:#1E2430;--cd:#1B2029}}
body{margin:0 auto;max-width:480px;padding:16px;background:var(--bg);color:var(--fg);font-family:Inter,system-ui,sans-serif;line-height:1.4}
h1{margin:0;font-size:26px}h2{font-size:17px;margin:20px 0 8px}
.m{color:var(--mu);font-size:13px;margin:4px 0}
label{display:block;font-size:14px;font-weight:600;margin-top:10px}
input,select,textarea{display:block;width:100%;box-sizing:border-box;min-height:46px;margin:4px 0;padding:10px 12px;border:1px solid var(--ln);border-radius:10px;background:var(--cd);color:var(--fg);font:inherit}
input[type=radio]{display:inline-block;width:20px;min-height:20px;margin:0 6px 0 0}
button{min-height:46px;padding:0 14px;border:0;border-radius:12px;background:var(--ac);color:var(--on);font:inherit;font-weight:600;cursor:pointer}
button.o{background:transparent;color:var(--ac);border:1.5px solid var(--ac)}
button:disabled{opacity:.45;cursor:default}
.seg{display:flex;gap:8px;margin:12px 0}.seg button{flex:1;background:var(--mp);color:var(--fg)}.seg button.on{background:var(--ac);color:var(--on)}
.c{border:1px solid var(--ln);border-radius:14px;padding:12px;margin-bottom:10px;background:var(--cd)}
.r{display:flex;gap:8px;align-items:center;justify-content:space-between}.r>button{flex:1}
.t{display:inline-block;font-size:12px;font-weight:600;padding:3px 8px;border-radius:99px;background:var(--tb);color:var(--tl)}
.w{background:var(--mp);border-radius:10px;padding:8px 10px;font-size:13px;margin:8px 0}
svg{display:block;width:100%;height:auto;background:var(--mp);border-radius:14px;margin-top:10px}
[hidden]{display:none!important}
</style>
</head>
<body>
<h1>Keliling</h1>
<p class="m" id="st"></p>

<section id="auth">
<div class="seg"><button id="ta" class="on">Masuk</button><button id="tr">Daftar</button></div>
<div id="reg" hidden>
<label for="an">Nama</label><input id="an" autocomplete="name">
<div class="r" style="justify-content:flex-start;gap:20px;margin:10px 0"><label style="margin:0"><input type="radio" name="ar" value="buyer" checked>Pembeli</label><label style="margin:0"><input type="radio" name="ar" value="vendor">Pedagang</label></div>
</div>
<label for="ap">Nomor HP</label><input id="ap" type="tel" inputmode="numeric" autocomplete="tel" placeholder="08xxxxxxxxxx">
<label for="aw">PIN 6 angka</label><input id="aw" type="password" inputmode="numeric" maxlength="6" autocomplete="current-password">
<button id="ago" style="width:100%;margin-top:12px">Masuk</button>
<p class="m" id="am"></p>
</section>

<main id="app" hidden>
<div class="r"><b id="who"></b><button class="o" id="out" style="flex:0;min-height:36px">Keluar</button></div>
<svg id="radar" viewBox="0 0 300 260" role="img" aria-label="Radar posisi"></svg>
<p class="m" id="loc">Mencari lokasi GPS…</p>

<section id="buyer">
<div id="sheet"></div>
<h2>Pedagang di sekitar</h2><div id="bl"></div>
<h2>Pesanan saya</h2><div id="bo"></div>
</section>

<section id="seller">
<label for="sn">Nama usaha</label><input id="sn">
<label for="sk">Jenis dagangan</label><input id="sk" placeholder="Es krim">
<label for="sm">Menu (satu per baris, nama:harga)</label><textarea id="sm" rows="3">Es krim cone:8000
Es krim cup:10000</textarea>
<label for="sr">Jarak jangkauan antar</label>
<select id="sr"><option value="0.5">500 m</option><option value="1">1 km</option><option value="2" selected>2 km</option><option value="3">3 km</option></select>
<div id="simbox" hidden><label for="sim">Simulasi jarak (hanya mode uji)</label>
<select id="sim"><option value="0">Posisi asli</option><option value="250">Geser 250 m</option><option value="700">Geser 700 m</option><option value="1500">Geser 1,5 km</option></select></div>
<button id="go" style="width:100%;margin-top:12px">Mulai keliling</button>
<h2>Pesanan masuk</h2><div id="so"></div>
</section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
// ====== ISI DUA BARIS INI DARI SUPABASE (Project Settings > API) ======
const SUPABASE_URL=const SUPABASE_URL="https://uvfvuxbwvlfixtsggunx.supabase.co";
const SUPABASE_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InV2ZnZ1eGJ3dmxmaXh0c2dndW54Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQ2MzU2NzAsImV4cCI6MjExMDIxMTY3MH0.SavJHnA7PkQvLyRylKhJQrWF5IEtQo6dcCUcXD77It8";
const SUPABASE_KEY="";   // pakai "anon public" key, JANGAN service_role
const EMAIL_DOMAIN="keliling.com"; // hanya untuk membentuk email internal dari nomor HP
// =====================================================================
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rp=n=>'Rp'+Math.round(n).toLocaleString('id-ID');
const fmt=d=>d<1000?Math.round(d)+' m':(d/1000).toFixed(1).replace('.',',')+' km';
const M=111320,uji=/uji=1/.test(location.search);
const sb=(SUPABASE_URL&&window.supabase)?supabase.createClient(SUPABASE_URL,SUPABASE_KEY):null;
let prof=null,uid=null,me={lat:3.5952,lng:98.6722},watching=false,V=[],O=[],sel=null,mode='antar',cart={},on=false,hasV=false,timer=null,regMode=false;

function dist(a,b){const t=Math.PI/180,x=(b.lng-a.lng)*t*Math.cos((a.lat+b.lat)/2*t),y=(b.lat-a.lat)*t;return Math.hypot(x,y)*6371000}
function rule(d){if(d<=300)return{min:0,fee:0};if(d<=1000)return{min:15000,fee:0};if(d<=2000)return{min:30000,fee:3000};return null}
function pos(){return prof&&prof.role==='vendor'?{lat:me.lat+(uji?+$('#sim').value:0)/M,lng:me.lng}:me}
const msg=t=>{$('#st').textContent=t||''};
const am=t=>{$('#am').textContent=t||''};

function track(){
  if(watching)return;
  if(!navigator.geolocation){$('#loc').textContent='GPS tidak tersedia, memakai lokasi contoh (Medan).';return}
  watching=true;
  navigator.geolocation.watchPosition(p=>{me={lat:p.coords.latitude,lng:p.coords.longitude};$('#loc').textContent='GPS aktif · akurasi ±'+Math.round(p.coords.accuracy)+' m';draw()},
  ()=>{$('#loc').textContent='GPS ditolak atau gagal. Izinkan lokasi di pengaturan browser.';draw()},{enableHighAccuracy:true,maximumAge:5000});
}

function radar(pts){
  const c=pos(),mx=Math.max(500,...pts.map(p=>p.d)),s=105/mx;
  let h='<circle cx="150" cy="130" r="105" fill="none" stroke="var(--ln)"/><circle cx="150" cy="130" r="52" fill="none" stroke="var(--ln)"/><text x="154" y="22" font-size="10" fill="var(--mu)">'+fmt(mx)+'</text>';
  pts.forEach(p=>{const x=150+(p.lng-c.lng)*Math.cos(c.lat*Math.PI/180)*M*s,y=130-(p.lat-c.lat)*M*s;
    h+='<circle cx="'+x+'" cy="'+y+'" r="8" fill="'+p.c+'"/><text x="'+(x+11)+'" y="'+(y+4)+'" font-size="11" fill="var(--fg)">'+esc(p.l.slice(0,14))+'</text>'});
  h+='<circle cx="150" cy="130" r="7" fill="#2563EB" stroke="#fff" stroke-width="2"/><text x="160" y="146" font-size="11" fill="var(--fg)">Kamu</text>';
  $('#radar').innerHTML=h;
}

function draw(){
  if(!prof)return;
  const c=pos();
  if(prof.role==='buyer'){
    const L=V.map(v=>({...v,d:dist(c,v)})).sort((a,b)=>a.d-b.d);
    $('#bl').innerHTML=L.length?L.map(v=>{const inR=v.d<=v.radius_km*1000&&rule(v.d);return '<div class="c"><div class="r"><b>'+esc(v.name)+'</b><span class="t">'+fmt(v.d)+'</span></div><div class="m">'+esc(v.kind)+(inR?'':' · di luar jangkauan antar')+'</div><div class="r" style="margin-top:8px"><button data-v="'+esc(v.id)+'" data-m="antar"'+(inR?'':' disabled')+'>Pesan antar</button><button class="o" data-v="'+esc(v.id)+'" data-m="datang">Aku ke sana</button></div></div>'}).join(''):'<p class="m">Belum ada pedagang yang sedang keliling.</p>';
    $('#bo').innerHTML=O.length?O.map(o=>{const v=V.find(x=>x.id===o.vendor_id),d=v?fmt(dist(c,v)):'-';
      const s={baru:'Menunggu pedagang',diterima:o.mode==='antar'?'Pedagang menuju lokasimu · sisa '+d:'Pedagang menunggu di titiknya · jarak '+d,selesai:'Selesai',ditolak:'Ditolak pedagang',dibatalkan:'Dibatalkan'}[o.status]||o.status;
      return '<div class="c"><div class="r"><b>'+esc(o.vendor_name)+'</b><span class="t">'+esc(o.status)+'</span></div><div class="m">'+esc(o.items.map(i=>i.q+'x '+i.n).join(', '))+' · '+rp(o.total)+'</div><div class="w">'+esc(s)+'</div>'+(o.status==='baru'?'<button class="o" data-o="'+esc(o.id)+'" data-s="dibatalkan" style="width:100%">Batalkan</button>':'')+'</div>'}).join(''):'<p class="m">Belum ada pesanan.</p>';
    const act=O.find(o=>o.status==='diterima'),av=act&&V.find(x=>x.id===act.vendor_id);
    radar(av?[{...av,c:'#C2410C',l:av.name,d:dist(c,av)}]:L.slice(0,6).map(v=>({...v,c:'#C2410C',l:v.name})));
    sheet();
  }else{
    $('#so').innerHTML=O.length?O.map(o=>{const d=fmt(dist(c,{lat:o.buyer_lat,lng:o.buyer_lng}));
      const b=o.status==='baru'?'<button data-o="'+esc(o.id)+'" data-s="diterima">Terima</button><button class="o" data-o="'+esc(o.id)+'" data-s="ditolak">Tolak</button>':o.status==='diterima'?'<button data-o="'+esc(o.id)+'" data-s="selesai">Tandai selesai</button>':'';
      return '<div class="c"><div class="r"><b>'+esc(o.buyer_name)+'</b><span class="t">'+esc(o.status)+'</span></div><div class="m">'+(o.mode==='antar'?'Pesan antar':'Pembeli datang')+' · '+d+' · '+rp(o.total)+'</div><div class="m">'+esc(o.items.map(i=>i.q+'x '+i.n).join(', '))+'</div><div class="r" style="margin-top:8px">'+b+'</div></div>'}).join(''):'<p class="m">Belum ada pesanan masuk.</p>';
    radar(O.filter(o=>o.status==='baru'||o.status==='diterima').map(o=>({lat:o.buyer_lat,lng:o.buyer_lng,c:'#2563EB',l:o.buyer_name,d:dist(c,{lat:o.buyer_lat,lng:o.buyer_lng})})));
  }
}

function sheet(){
  const v=V.find(x=>x.id===sel);
  if(!v){$('#sheet').innerHTML='';return}
  const d=dist(me,v),r=mode==='antar'?rule(d):{min:0,fee:0},sub=v.items.reduce((s,i,k)=>s+i.p*(cart[k]||0),0);
  const ok=r&&sub>0&&sub>=r.min&&(mode==='datang'||d<=v.radius_km*1000);
  $('#sheet').innerHTML='<div class="c"><div class="r"><b>'+esc(v.name)+'</b><button class="o" id="x" style="flex:0;min-height:36px">Tutup</button></div><div class="m">'+(mode==='antar'?'Pedagang datang ke lokasimu · '+fmt(d):'Kamu datang ke pedagang · '+fmt(d)+(d>1000?' (cukup jauh)':''))+'</div>'+
  v.items.map((i,k)=>'<div class="r" style="margin:6px 0"><span>'+esc(i.n)+' <span class="m">'+rp(i.p)+'</span></span><span class="r"><button class="o" data-q="'+k+'" data-d="-1" style="min-height:40px">-</button><b>'+(cart[k]||0)+'</b><button class="o" data-q="'+k+'" data-d="1" style="min-height:40px">+</button></span></div>').join('')+
  (r&&r.min?'<div class="w">Jarak '+fmt(d)+': minimal order '+rp(r.min)+(r.fee?' + ongkos '+rp(r.fee):'')+'</div>':'')+
  '<div class="r"><span>Total</span><b>'+rp(sub+(sub&&r?r.fee:0))+'</b></div><button id="ord" style="width:100%;margin-top:8px"'+(ok?'':' disabled')+'>Pesan sekarang</button><div class="m">Bayar di tempat: tunai atau QRIS pedagang.</div></div>';
}

async function refresh(){
  if(!sb||!prof)return;
  if(prof.role==='buyer'){const r=await sb.from('vendors').select('*').eq('is_on',true);V=(r.data||[]).filter(v=>v.lat!=null&&Date.now()-new Date(v.updated_at)<120000)}
  const o=await sb.from('orders').select('*').order('created_at',{ascending:false}).limit(30);
  if(o.error){msg('Gagal memuat pesanan: '+o.error.message);return}
  O=o.data||[];draw();
}

async function pub(){
  const items=$('#sm').value.split('\n').map(l=>{const i=l.lastIndexOf(':');return{n:l.slice(0,i).trim().slice(0,40),p:Math.round(+l.slice(i+1))}}).filter(i=>i.n&&i.p>0);
  const c=pos();
  const row={name:$('#sn').value.trim()||prof.name,kind:$('#sk').value.trim()||'Dagangan',items,radius_km:+$('#sr').value,is_on:on,lat:c.lat,lng:c.lng};
  const r=hasV?await sb.from('vendors').update(row).eq('id',uid):await sb.from('vendors').insert({id:uid,...row});
  if(r.error){msg('Gagal menyimpan: '+r.error.message);return false}
  hasV=true;msg('');return true;
}

async function enter(user){
  uid=user.id;
  const r=await sb.from('profiles').select('*').eq('id',uid).maybeSingle();
  if(r.error||!r.data){am('Profil tidak ditemukan. Pastikan schema.sql sudah dijalankan.');return}
  prof=r.data;$('#auth').hidden=true;$('#app').hidden=false;
  $('#who').textContent=prof.name+' · '+(prof.role==='vendor'?'Pedagang':'Pembeli');
  $('#buyer').hidden=prof.role!=='buyer';$('#seller').hidden=prof.role!=='vendor';
  $('#simbox').hidden=!uji;
  if(prof.role==='vendor'){
    const v=await sb.from('vendors').select('*').eq('id',uid).maybeSingle();
    if(v.data){hasV=true;$('#sn').value=v.data.name;$('#sk').value=v.data.kind;$('#sm').value=v.data.items.map(i=>i.n+':'+i.p).join('\n');$('#sr').value=String(+v.data.radius_km)}
    else $('#sn').value=prof.name;
  }
  track();await refresh();
  sb.channel('keliling').on('postgres_changes',{event:'*',schema:'public',table:'vendors'},refresh).on('postgres_changes',{event:'*',schema:'public',table:'orders'},refresh).subscribe();
  setInterval(refresh,8000);
}

async function submit(){
  const phone=$('#ap').value.replace(/\D/g,''),pin=$('#aw').value;
  if(!/^\d{8,14}$/.test(phone))return am('Nomor HP tidak valid.');
  if(!/^\d{6}$/.test(pin))return am('PIN harus 6 angka.');
  const email=phone+'@'+EMAIL_DOMAIN;let r;
  if(regMode){const name=$('#an').value.trim();if(!name)return am('Isi nama.');
    const role=document.querySelector('input[name=ar]:checked').value;
    r=await sb.auth.signUp({email,password:pin,options:{data:{name,phone,role}}});
  }else r=await sb.auth.signInWithPassword({email,password:pin});
  if(r.error)return am(r.error.message==='Invalid login credentials'?'Nomor HP atau PIN salah.':r.error.message);
  if(!r.data.session)return am('Akun dibuat tetapi belum aktif. Matikan "Confirm email" di Supabase (Authentication > Providers > Email).');
  enter(r.data.user);
}

document.addEventListener('click',async e=>{
  const t=e.target.closest('button');if(!t||!sb)return;
  if(t.id==='ta'||t.id==='tr'){regMode=t.id==='tr';$('#ta').classList.toggle('on',!regMode);$('#tr').classList.toggle('on',regMode);$('#reg').hidden=!regMode;$('#ago').textContent=regMode?'Daftar':'Masuk';am('')}
  else if(t.id==='ago')submit();
  else if(t.id==='out'){await sb.auth.signOut();location.reload()}
  else if(t.id==='go'){
    on=!on;t.textContent=on?'Berhenti keliling':'Mulai keliling';clearInterval(timer);
    const ok=await pub();if(!ok){on=false;t.textContent='Mulai keliling';return}
    if(on)timer=setInterval(pub,15000);
  }
  else if(t.dataset.v){sel=t.dataset.v;mode=t.dataset.m;cart={};draw()}
  else if(t.id==='x'){sel=null;draw()}
  else if(t.dataset.q){const k=t.dataset.q;cart[k]=Math.max(0,(cart[k]||0)+ +t.dataset.d);sheet()}
  else if(t.id==='ord'){
    const v=V.find(x=>x.id===sel);if(!v)return;
    const items=Object.keys(cart).filter(k=>cart[k]>0).map(k=>({k:+k,q:cart[k]}));
    t.disabled=true;
    const r=await sb.rpc('place_order',{p_vendor:v.id,p_mode:mode,p_items:items,p_lat:me.lat,p_lng:me.lng});
    if(r.error){msg(r.error.message);t.disabled=false;return}
    msg('Pesanan terkirim.');sel=null;cart={};await refresh();
  }
  else if(t.dataset.o){const r=await sb.rpc('set_order_status',{p_id:t.dataset.o,p_status:t.dataset.s});if(r.error)msg(r.error.message);else{msg('');await refresh()}}
});
$('#sim').addEventListener('change',()=>{draw();if(on)pub()});

(async()=>{
  if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
  if(!sb){am('Aplikasi belum dikonfigurasi: isi SUPABASE_URL dan SUPABASE_KEY di index.html.');return}
  const s=await sb.auth.getSession();
  if(s.data.session)enter(s.data.session.user);
})();
</script>
</body>
</html>
